<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda do Consultório</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6F5E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div id="tela-login" class="tela-login">
  <div class="cartao-login">
    <img src="logo.png" alt="Logo" class="logo-login">
    <h2>Agenda do Consultório</h2>
    <p class="subtitulo">Entre com seu usuário e senha.</p>
    <div id="erro-login" class="erro-login"></div>
    <form id="form-login">
      <div class="campo">
        <label for="login-usuario">Usuário</label>
        <input type="text" id="login-usuario" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primario" style="width:100%">Entrar</button>
    </form>
  </div>
</div>

<!-- ===== APP PRINCIPAL (LAYOUT COM SIDEBAR) ===== -->
<div id="app" class="oculto app-shell">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="marca-sidebar">
      <img src="logo.png" alt="Logo" class="logo-sidebar">
    </div>

    <!-- Mini calendário -->
    <div class="mini-calendario">
      <div class="mini-calendario-topo">
        <button type="button" id="btn-hoje" class="btn-hoje">Hoje</button>
        <div class="mini-calendario-nav">
          <button type="button" id="btn-mes-anterior" class="btn-nav-icone" aria-label="Mês anterior">‹</button>
          <span id="mini-calendario-titulo"></span>
          <button type="button" id="btn-mes-proximo" class="btn-nav-icone" aria-label="Próximo mês">›</button>
        </div>
      </div>
      <div class="mini-calendario-dias-semana">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
      </div>
      <div id="mini-calendario-grade" class="mini-calendario-grade"></div>
    </div>

    <div class="campo sidebar-campo">
      <label>Profissional</label>
      <select id="filtro-profissional"></select>
    </div>

    <nav class="menu-lateral">
      <a href="#" id="btn-aba-agenda" class="aba-ativa">📅 Agenda</a>
      <a href="#" id="btn-aba-pacientes">🧑‍🤝‍🧑 Pacientes</a>
      <a href="#" id="btn-aba-relatorios">📊 Relatórios</a>
      <a href="#" id="btn-admin" class="oculto">⚙️ Profissionais</a>
    </nav>

    <div class="sidebar-rodape">
      <a href="#" id="btn-notificacoes" class="oculto link-notificacoes">🔔 Notificações <span id="contador-notificacoes" class="contador oculto">0</span></a>
      <div class="usuario-sidebar">
        <strong id="nome-usuario-logado"></strong>
        <span id="perfil-usuario-logado"></span>
      </div>
      <a href="#" id="btn-sair" class="btn-sair-link">Sair</a>
    </div>
  </aside>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="conteudo-principal">

    <!-- ===== ABA AGENDA (grade de horários, estilo PEC) ===== -->
    <section id="secao-agenda">
      <div class="barra-topo-conteudo">
        <div class="navegacao-dia">
          <button type="button" id="btn-dia-anterior" class="btn-nav-icone" aria-label="Dia anterior">‹</button>
          <h2 id="titulo-dia"></h2>
          <button type="button" id="btn-dia-proximo" class="btn-nav-icone" aria-label="Próximo dia">›</button>
        </div>
        <input type="date" id="filtro-data" class="oculto-visual">
        <div class="busca-topo">
          <input type="text" id="busca-paciente" placeholder="Buscar paciente...">
        </div>
        <button id="btn-nova-consulta" class="btn-primario">+ Nova consulta</button>
      </div>

      <div id="alerta-proxima" class="alerta-proxima oculto"></div>

      <div class="grade-horarios-container">
        <div id="grade-horarios" class="grade-horarios"></div>
      </div>
    </section>

    <!-- ===== ABA PACIENTES ===== -->
    <section id="secao-pacientes" class="oculto">
      <div class="barra-topo-conteudo">
        <h2>Pacientes</h2>
        <div class="busca-topo">
          <input type="text" id="busca-paciente-cadastro" placeholder="Buscar paciente cadastrado...">
        </div>
        <button id="btn-novo-paciente" class="btn-primario">+ Novo paciente</button>
      </div>
      <div id="lista-pacientes" class="lista-consultas"></div>
    </section>

    <!-- ===== ABA RELATÓRIOS ===== -->
    <section id="secao-relatorios" class="oculto">
      <div class="barra-topo-conteudo">
        <h2>Relatórios</h2>
      </div>
      <div class="barra-controle">
        <div class="campo" style="margin:0">
          <label style="margin:0">Profissional</label>
          <select id="rel-profissional"></select>
        </div>
        <div class="campo" style="margin:0">
          <label style="margin:0">De</label>
          <input type="date" id="rel-data-inicio">
        </div>
        <div class="campo" style="margin:0">
          <label style="margin:0">Até</label>
          <input type="date" id="rel-data-fim">
        </div>
        <button id="btn-gerar-relatorio" class="btn-primario">Gerar</button>
        <div class="espaco"></div>
        <button id="btn-exportar-excel" class="btn-secundario">⬇ Excel</button>
        <button id="btn-exportar-pdf" class="btn-secundario">⬇ PDF</button>
      </div>
      <div id="conteudo-relatorio"></div>
    </section>

  </main>
</div>

<!-- ===== MODAL DE CONSULTA ===== -->
<div id="overlay-modal" class="overlay oculto">
  <div class="modal">
    <h3 id="titulo-modal">Nova consulta</h3>
    <div id="aviso-conflito" class="aviso-conflito"></div>
    <form id="form-consulta">
      <input type="hidden" id="consulta-id">
      <input type="hidden" id="consulta-paciente-id">
      <div class="campo">
        <label for="consulta-profissional">Profissional</label>
        <select id="consulta-profissional" required></select>
      </div>
      <div class="campo" style="position:relative">
        <label for="consulta-paciente">Paciente</label>
        <input type="text" id="consulta-paciente" required autocomplete="off">
        <div id="sugestoes-paciente" class="sugestoes oculto"></div>
      </div>
      <div class="campo">
        <label for="consulta-data">Data</label>
        <input type="date" id="consulta-data" required>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="consulta-hora-inicio">Início</label>
          <input type="time" id="consulta-hora-inicio" required>
        </div>
        <div class="campo">
          <label for="consulta-hora-fim">Fim</label>
          <input type="time" id="consulta-hora-fim" required>
        </div>
      </div>
      <div class="campo">
        <label for="consulta-status">Status</label>
        <select id="consulta-status">
          <option value="agendado">Agendado</option>
          <option value="confirmado">Confirmado</option>
          <option value="realizado">Realizado</option>
          <option value="falta">Falta</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="consulta-valor">Valor (R$)</label>
          <input type="number" id="consulta-valor" min="0" step="0.01">
        </div>
        <div class="campo">
          <label for="consulta-pagamento">Pagamento</label>
          <select id="consulta-pagamento">
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
          </select>
        </div>
      </div>
      <div class="campo">
        <label for="consulta-forma-pagamento">Forma de pagamento</label>
        <select id="consulta-forma-pagamento">
          <option value="">—</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="pix">Pix</option>
          <option value="cartao">Cartão</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="campo">
        <label for="consulta-obs">Observações</label>
        <textarea id="consulta-obs" rows="2"></textarea>
      </div>
      <div id="area-historico-consulta"></div>
      <div class="modal-acoes">
        <button type="button" id="btn-cancelar-modal" class="btn-secundario">Cancelar</button>
        <button type="submit" class="btn-primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== MODAL DE PACIENTE ===== -->
<div id="overlay-paciente" class="overlay oculto">
  <div class="modal">
    <h3 id="titulo-modal-paciente">Novo paciente</h3>
    <form id="form-paciente">
      <input type="hidden" id="paciente-id">
      <div class="campo">
        <label for="paciente-nome">Nome</label>
        <input type="text" id="paciente-nome" required>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="paciente-telefone">Telefone</label>
          <input type="text" id="paciente-telefone">
        </div>
        <div class="campo">
          <label for="paciente-email">E-mail</label>
          <input type="email" id="paciente-email">
        </div>
      </div>
      <div class="campo">
        <label for="paciente-obs">Anotações / prontuário</label>
        <textarea id="paciente-obs" rows="3"></textarea>
      </div>
      <div id="area-historico-paciente"></div>
      <div class="modal-acoes">
        <button type="button" id="btn-cancelar-paciente" class="btn-secundario">Fechar</button>
        <button type="submit" class="btn-primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== MODAL DE ADMINISTRAÇÃO DE PROFISSIONAIS ===== -->
<div id="overlay-admin" class="overlay oculto">
  <div class="modal" style="max-width:560px">
    <h3>Profissionais cadastrados</h3>
    <div id="lista-admin-profissionais" style="margin-bottom:20px"></div>
    <h3 style="font-size:1rem">Cadastrar novo</h3>
    <form id="form-novo-profissional">
      <div class="linha-dupla">
        <div class="campo">
          <label for="novo-nome">Nome completo</label>
          <input type="text" id="novo-nome" required>
        </div>
        <div class="campo">
          <label for="novo-usuario">Usuário (login)</label>
          <input type="text" id="novo-usuario" required>
        </div>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="novo-perfil">Perfil</label>
          <select id="novo-perfil">
            <option value="profissional">Profissional</option>
            <option value="secretaria">Secretária (admin)</option>
          </select>
        </div>
        <div class="campo">
          <label for="novo-especialidade">Especialidade</label>
          <input type="text" id="novo-especialidade">
        </div>
      </div>
      <div class="campo">
        <label for="novo-senha">Senha inicial</label>
        <input type="text" id="novo-senha" required>
      </div>
      <div class="modal-acoes">
        <button type="button" id="btn-fechar-admin" class="btn-secundario">Fechar</button>
        <button type="submit" class="btn-primario">Cadastrar</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== MODAL DE NOTIFICAÇÕES ===== -->
<div id="overlay-notificacoes" class="overlay oculto">
  <div class="modal">
    <h3>Notificações</h3>
    <div id="lista-notificacoes"></div>
    <div class="modal-acoes">
      <button type="button" id="btn-fechar-notificacoes" class="btn-secundario">Fechar</button>
    </div>
  </div>
</div>

<div id="area-impressao" class="somente-impressao"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
